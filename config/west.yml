    # badjeff/zmk-pmw3610-driver から cormoran さんの custom Studio RPC 対応版へ。
    # Zephyr 4.1 が純正 "pixart,pmw3610" を取り込んだため旧 compatible は
    # そのまま使えない。compatible は "cormoran,pmw3610" に変わり、
    # swap-xy / invert-x / invert-y は devicetree ではなく
    # CONFIG_PMW3610_SWAP_XY / _INVERT_X / _INVERT_Y になる (Studio から変更可)。
