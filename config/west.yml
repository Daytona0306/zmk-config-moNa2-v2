    # mona2_r.overlay の先頭側で定義して0番を取らせている。
    - name: zmk-module-mouse-gesture-rpc
      remote: shakushakupanda
      revision: 1374f1d487d5df07d6d990f1c058d9c7a313f90d  # track: main
