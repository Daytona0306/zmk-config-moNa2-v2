# ========================================
# Input & Hardware Settings
# ========================================
# Key Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Encoder (EC11)
CONFIG_EC11=y
# ★専用スレッドで回す。GLOBAL_THREAD だと EC11 の割り込み後処理が
#  システムワークキュー上で走るため、他が詰まっているときに回転を
#  取りこぼす。本家 (shakushakupanda) も OWN_THREAD。
#  こちらに入っていなかったのは、v0.4 移行を private の v0.3 系を土台に
#  やり直した経緯によるもので、意図して外したものではない。
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

# ========================================
# Bluetooth & Connectivity
# ========================================
# Bluetooth Power & Connection Tweaks 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ペアリング上限・接続上限。右半分と torabo-tsuki に揃える。
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6

# 通信安定化の独自設定（1Mbps固定・干渉への耐性強化）
# 長時間使用後に接続が切れる事象への対策。torabo-tsuki と同じ設定。
#  - ENFORCE_SUBSCRIPTION=n : 再接続時にホストが CCC 購読を復元しない場合に
#    「繋がっているのに入力が通らない」状態になるのを避ける（Windows で既知）
#  - PHY_2M=n : 1Mbps 固定。2.4GHz が混雑した環境では 2M PHY より安定する
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 接続間隔の短縮（必要に応じてコメントアウト解除）
# ZMK_BLE_EXPERIMENTAL_CONN が接続パラメータを自前で扱うため、
# torabo-tsuki ではこの3行を無効にしている。揃えておく。
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0


# ========================================
# Power Management
# ========================================
# Sleep & Soft Off
CONFIG_ZMK_SLEEP=y
# 9000000ms = 150 minutes (torabo-tsuki と同じ)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_PM_SOFT_OFF=y

# ========================================
# Battery Settings
# ========================================
# Basic Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Split Keyboard Battery Reporting 
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# zmk-module-battery-history 
#CONFIG_ZMK_BATTERY_HISTORY=y

# ========================================
# Features, System & Settings
# ========================================
# zmk-module-settings-rpc 
CONFIG_ZMK_SETTINGS_RPC=y

# フリーズ・ハードフォルト・予期しないリセットを Flash に記録する。
# 周辺側 (左手) も自分自身のインシデントを記録し、中央側から中継して
# DYA Studio の「安定性」タブで "Peripheral" を選ぶと参照できる。
# 右半分には入っていて左だけ無い状態だったので揃える。
CONFIG_ZMK_WATCHDOG=y

# Split relay and settings persistence
#
# DATA_LEN と KSCAN_DIAGNOSTICS は右半分と揃えること。診断のクエリに答えるのは
# peripheral 側なので、こちらにも必要になる。揃っていないと右半分のビルドが
# BUILD_ASSERT で落ちる (mona2_r.conf 参照)。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
