# ========================================
# Input & Hardware Settings
# ========================================
# Key Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Encoder (EC11)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# =========================================================
# Pointing Device & Trackball Settings (PMW3610)
# =========================================================
# PMW3610 Power saving & Polling tweaks
#
# v0.3 (badjeff/zmk-pmw3610-driver の zmk-0.3 ブランチ) からそのまま。
# cormoran 版もシンボル名・既定値が zmk-0.3 と完全に一致しているので、
# 明示していない項目 (RUN_DOWNSHIFT 128 / REST1_DOWNSHIFT 5000 /
# REST1_SAMPLE 40 / REST2_SAMPLE 100 / SMART_ALGORITHM y) の挙動も変わらない。
#
# NOTE: badjeff の現在の main はシンボルが PMW3610_ALT_* に改名されている。
#       そちらを掴むとこの3行は未定義シンボルとして無視される。
#
# NOTE: CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y にしているので、これらは
#       「初期値」でしかない。DYA Studio のセンサータブで変更して保存すると
#       保存値が優先される (pmw3610.c の pmw3610_settings_apply_to_device)。
#       以後ここを書き換えて焼き直しても、settings_reset するまで反映されない。
# ★15ms (約66.7Hz) は意図的に落とした値。上げないこと。
#   レートを上げると BLE の電波占有が増え、Bluetooth ヘッドセットで
#   通話中に遅延が出た。2.4GHz の取り合いなので、キーボード側を譲ってある。
#   ドライバの help には「USB only なら 8ms にするとキレが出る」とあるが、
#   ここはワイヤレス前提なので従わない。BLE の接続間隔が 7.5〜15ms ある
#   以上、8ms にしてもワイヤレスでは出し切れず電波を余計に使うだけになる。
#
#   15 という値は torabo-tsuki に合わせたもの。あちらの PAW3222 ドライバは
#   src/paw3222.c:451 が
#       k_timer_start(&data->motion_timer, K_MSEC(15), K_NO_WAIT);
#   で 15ms 固定 (Kconfig も DT プロパティも無く上げようがない)。同じ環境で
#   毎日使っていてヘッドセットの症状が出ていないので、実績のある水準はここ。
#   以前は 16 にしていたが、それは実測ではなく当てずっぽうの値だった。
#
#   PMW3610 は既定 (REPORT_INTERVAL_MIN=0) だと絞りが一切効かず、RUN モード
#   のサンプリングがそのまま出る。明示的に書かないと意味がない。
CONFIG_PMW3610_REPORT_INTERVAL_MIN=15
# REST2 -> REST3 へ落ちるまで10分。上限は 255*128*REST2_SAMPLE(100ms)=3264000ms。
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=600000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

# Trackball Acceleration 
#CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
#CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_CUSTOM=y
#CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_SIMPLE=y
##CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_OFFICE_TRACKBALL=y

# ========================================
# Bluetooth & Connectivity
# ========================================
# Bluetooth Tweaks 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6
# 通信安定化の独自設定（1Mbps固定・干渉への耐性強化）
# 長時間使用後に接続が切れる事象への対策。torabo-tsuki と同じ設定。
#  - ENFORCE_SUBSCRIPTION=n : 再接続時にホストが CCC 購読を復元しない場合に
#    「繋がっているのに入力が通らない」状態になるのを避ける（Windows で既知）
#  - PHY_2M=n : 1Mbps 固定。2.4GHz が混雑した環境では 2M PHY より安定する
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ── USB のポーリング間隔 ──
# 1ms = 1000Hz。ポインティングデバイスを USB で使うときの追従性に効く。
# 本家 (shakushakupanda) も 1。こちらに入っていなかったのは v0.4 移行の
# 土台の違いによるもので、意図して外したものではない。
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
#
# NOTE: PHY_2M=n は v0.4 で新しく有効にした (v0.3 ではコメントアウト)。
#   これは電波占有時間に効くので、上の REPORT_INTERVAL_MIN と同じ
#   「Bluetooth ヘッドセットの通話遅延」に関わる。向きは一概に言えない:
#     1M 固定 → 1パケットの送信時間が倍になり占有は増えるが、感度が高く
#               再送が減るぶん結果的に有利なこともある
#     2M      → 占有は減るが感度が 6dB 落ち、混雑下では再送が増えうる
#   ヘッドセットの遅延が v0.3 より悪化したら、まずこの行を消して
#   (= 既定の 2M 許可に戻して) 切り分けること。

# 接続間隔の短縮（必要に応じてコメントアウト解除）
# ZMK_BLE_EXPERIMENTAL_CONN が接続パラメータを自前で扱うため、
# torabo-tsuki ではこの3行を無効にしている。揃えておく。
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ========================================
# Power Management
# ========================================
# Sleep & Soft Off 
CONFIG_ZMK_SLEEP=y
# 9000000ms = 150 minutes (torabo-tsuki と同じ)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_PM_SOFT_OFF=y

# ========================================
# Battery Settings
# ========================================
# Basic Battery Reporting 
CONFIG_ZMK_BATTERY_REPORTING=y

# Split Keyboard Battery Reporting 
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ========================================
# Layer LED Widget
# ========================================
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

# ========================================
# ZMK Studio & Advanced RPC Modules 
# ========================================
CONFIG_ZMK_STUDIO=y
# Studio のロック。既定 (y) のまま使う。
#
# ロックは「SECURED と宣言されたハンドラ」だけを弾く (app/src/studio/rpc.c)。
# ZMK 本体のキーマップ系は全部 SECURED なので、&studio_unlock を押すまで
# キーマップの読み書きはできない。
#
# ただし DYA Studio のカスタム RPC はほぼ全部 UNSECURED で、ランタイム
# マクロ / コンボ / ジェスチャー / 各種設定はロック中でも読み書きできる。
# つまりランタイムマクロの中身は、ロック中でも読み出せる。
#
# 参考リポジトリ (shakushakupanda) は n にしているが、ここでは合わせない。
CONFIG_ZMK_STUDIO_LOCKING=y
# Studio が behavior を識別する ID の方式。torabo-tsuki と揃える。
# 後から変えると Studio に保存済みのキーマップが読めなくなるので、
# v0.4 のファームを焼く前の今のうちに決めておく。
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
#CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n

# zmk-module-ble-management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# zmk-module-battery-history
#CONFIG_ZMK_BATTERY_HISTORY=y
#CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
#CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# zmk-module-settings-rpc
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# zmk-module-runtime-input-processor
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# zmk-behavior-runtime-sensor-rotate
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# ========================================
# System & Split Settings 
# ========================================
# Split relay and central stack
#
# DATA_LEN は左右で 256 に揃えること。kscan 診断の peripheral 応答
# (struct ksd_relay_reply) がこの値に収まらないと BUILD_ASSERT で落ちる:
#   "kscan diagnostics peripheral replies need
#    CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256 on both split halves"
# モジュール側も Kconfig の default で 256 にしているが、ZMK 本体の default
# (128) に parse 順で負けることがあるため明示的に書く必要がある。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
# central から peripheral へコマンドを送るワークキューのスタック
# (central.c の split_central_split_run_q)。
#
# ★この 3096 という値に根拠はない。
#   4103307「Add scroll inertia free input processor to mona2.dtsi」で
#   入ったが、実際に落ちたのを直した結果ではなく、どこかの設定例から
#   引き写したもの。慣性スクロールはこのワークキューでは動かない
#   (入力リスナー側) ので、慣性とも無関係。
#
#   比較: ZMK 既定 512 / shakushakupanda 版 moNa2 は未設定 (= 512) /
#         torabo-tsuki は作者が 768。つまり 3096 は既定の6倍で外れ値。
#
#   それでも下げていないのは、節約できるのが 2.3KB しかなく
#   (nRF52840 の 256KB に対して1%未満)、v0.4 をまだ実機で確認して
#   いない段階で変数を増やす利点が無いから。スタックは大きいぶんには
#   壊れない。
#
#   → RAM が足りなくなったら、まっさきにここを削ること。512 まで
#      一気に落として構わない。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096

# Settings persistence
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000


# ══════════════════════════════════════════════════════════════
# ZMK v0.4 移行で追加した設定
# ══════════════════════════════════════════════════════════════

# ── トラックボール (PMW3610) ──
# cormoran 版ドライバでは軸反転が devicetree プロパティではなく Kconfig。
# 旧 mona2_r.overlay の invert-x はこれに置き換わった。
# DYA Studio から実行時にも変更できる。
# チェーン上の &zip_xy_transform が X と Y の両方を反転させるので、
# ここはその打ち消しとして効く。正味の向きは
#   X = transform(反転) XOR INVERT_X,  Y = transform(反転) XOR INVERT_Y
#
# v0.3 では DT に軸の指定が無く、DYA Studio で mouse_runtime_input_processor の
# x_invert / y_invert を設定して Flash に保存していた。settings_reset すると
# それが消えて向きが狂うので、DT 側に持たせておく。
#
# ドライバの Kconfig に置いているのは、DYA Studio のセンサータブから実行時にも
# 変更できるため (zip_xy_transform 側に書くと Studio から触れなくなる)。
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=y

# ── 設定の永続化レイヤ ──
# runtime-combo / runtime-macro / runtime-input-processor の土台。
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# ZMK_RUNTIME_MACRO_MAX_BYTES の許容範囲は
#   [ZMK_CUSTOM_SETTINGS_VALUE_MAX_SIZE, ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE]
# で決まる。LARGE 側の既定は VALUE 側と同じ 64 なので、これを上げないと
# 範囲が [64,64] に潰れて 256 が弾かれる (ZMK は Kconfig 警告をエラー扱い)。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ── コンボ / マクロのランタイム編集 ──
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# ── マウスジェスチャーの RPC 編集 ──
# gestures.dtsi の6セットとは独立。RPC 側は DT インスタンス0番 (mg) のみを使う。
CONFIG_ZMK_MOUSE_GESTURE_RPC=y
# セット数は 1..16 だが、Web UI / behavior メタデータ / エイリアス解析が
# いずれも3固定なので実質3セット (README 参照)。
CONFIG_ZMK_MOUSE_GESTURE_RPC_NUM_SETS=5

# ── DYA Studio のトラックボールセンサータブ ──
# cormoran 版 PMW3610 ドライバを入れているのはこのため。
# CUSTOM_SETTINGS 側が CPI・軸反転などの実行時変更と永続化を担う。
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# ── Zephyr settings の閲覧 (west.yml の zmk-feature-zephyr-setting-expose) ──
# 入れてあるのに有効化していなかった。
CONFIG_ZMK_SETTING_EXPOSE=y

# ── DYA Studio の診断タブ ──
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y

# ── Studio RPC のバッファとスタック ──
# 2048 バイトのバッファは nRF52840 でキーマップ読み込みが固まる事例があるため
# 512 に抑える。
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
# 大きな通知ボディをエンコードする際のスタックオーバーフロー対策
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# ── スムーススクロール ──
# HID の Resolution Multiplier をレポートマップに載せ、対応ホストで
# ノッチを細かく割って送れると申告する。対応ホストなら行ごとではなく
# 連続的にスクロールする。
#
# このシンボルは central 側にしか存在しない
# (app/src/pointing/Kconfig の `if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`)。
# 右 = central のこのファイルに置くこと。mona2_l.conf に書いても無音で
# 無効のままになる。
#
# ★焼いた直後はスクロールが遅くなる。これは想定どおり★
# ZMK は値をそのまま流し、ホスト側だけが 1カウント = 1/N ノッチとして
# 解釈する (app/src/pointing/input_listener.c の apply_resolution_scaling
# は div と scaled を計算しながら最後に evt->value = val として割った
# 結果を捨てる。本家も同じコード)。詰めるのは焼き直しではなく DYA Studio
# のスクロール倍率で行う。値は Flash にだけ保存されるので、決まったら
# DT 側の既定に書き戻すこと。
#
# ★注意★ HID レポートマップが変わるので、ペアリング済みホストとは
# 再ペアリングが必要になることがある。接続が変になったら settings_reset
# (mona2_reset) を焼いてペアリングし直すこと。
#
# ★注意★ SYM2 レイヤーの `&msc` 5倍速スクロールも、交渉したホストでは
# 細かく(=弱く)感じるようになる。倍率は Studio 側で補うこと。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ── 接続先 / OS ごとのデフォルトレイヤー ──
# 検出した OS ごとに常時 ON のレイヤーを切り替える。
# DYA Studio の「OS ごとのデフォルトレイヤー」パネルから割り当てる。
#
# MIN/MAX_INDEX は「パネルで選べる範囲」ではなく、切替時に強制 deactivate
# するループの範囲 (src/default_layer.c の apply_layer())。iPad レイヤーの
# index 1 だけに絞ること。広げるとモーメンタリなレイヤー 2..12 が切替の
# 巻き添えで落とされる。レイヤー0は global_default としてループから除外
# されているので、そもそも落ちない。
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# ── OS 判定 ──
# default-layer とは独立して使える。Studio から判定結果を確認できるので、
# 接続が不安定なときの切り分け材料になる。
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
# USB 側の判定。無効のままにしてある。
#
# これは CONFIG_USB_DEVICE_BOS を select し、USB デバイス記述子の bcdUSB を
# 2.00 から 2.01 へ上げる。host が GET_DESCRIPTOR(BOS) を読みに来るようになり
# USB 列挙の経路そのものが変わる。モジュール側にも
# docs/windows-usb-enumeration-issue.md として「Windows がデバイスを
# 認識しなくなった (macOS/Linux は無事)」という記録がある。
#
# torabo-tsuki で「DYA Studio に USB 接続できないのはこれが原因」と考えたが、
# n に戻しても同じ症状が出たので原因ではなかった。症状自体も列挙の失敗ではなく
# 「接続が断続的に失敗する (再試行すれば繋がる)」というものだった。
#
# n のままにしてあるのは、列挙の経路を変える副作用に対して得るものが
# 小さいため。
#
# ※このコメントは以前「ベースレイヤーが1枚しかなく切り替え先が無い」と
#   書いていたが、それは iPad レイヤー (index 1) を足す前の話で、いまは
#   当てはまらない。CONFIG_ZMK_DEFAULT_LAYER_MIN/MAX_INDEX=1 で切り替え先も
#   設定済み。BLE 側 (=y) の判定は効いているので、iPad を USB で繋ぐ
#   場面が出てきたら y にする価値がある。torabo-tsuki は y。
CONFIG_ZMK_OS_DETECTION_USB=n
#
# NOTE: os-detection 自身の CONFIG_ZMK_OS_DETECTION_LAYER_* による自動切替は
#       default-layer モジュールと競合するので有効にしないこと。
